# Maven
# Build your Java project and run tests with Apache Maven.
# Add steps that analyze code, save build artifacts, deploy, and more:
# https://docs.microsoft.com/azure/devops/pipelines/languages/java

# azure-pipelines.yml

trigger:
  - main

# This routes the job to your specific PC
pool:
  name: 'MY POOL'

steps:
# Azure DevOps automatically checks out the code first, so we don't need a specific step for it.

# Using CmdLine@2 forces standard Command Prompt, avoiding the PowerShell parsing issues with Maven arguments
- task: CmdLine@2
  displayName: 'Run Maven Tests (BDD Default)'
  inputs:
    script: |
      mvn clean test -Dsurefire.suiteXmlFiles=testng-bdd.xml -Dheadless=true

# Uploads the reports and screenshots back to Azure DevOps
- task: PublishPipelineArtifact@1
  condition: always()
  displayName: 'Upload Test Artifacts'
  inputs:
    targetPath: '$(System.DefaultWorkingDirectory)'
    artifact: 'Automation-Artifacts'
    publishLocation: 'pipeline'