name: DemoQA Automation Suite

on:
  # Triggers automatically when code is pushed to the main branch
  push:
    branches: [ "main" ]

  # Allows you to run this workflow manually from the GitHub Actions UI
  workflow_dispatch:
    inputs:
      test_suite:
        description: 'Which Test Suite do you want to execute?'
        required: true
        default: 'testng-bdd.xml'
        type: choice
        options:
          - testng-bdd.xml
          - testng-combined.xml
          - testng-nonbdd.xml

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # ---> THIS IS THE NEW STEP FIXING YOUR JAR ISSUE <---
      - name: Install Local QA_Utils JAR
        run: mvn install:install-file "-Dfile=lib/QA_Utils-1.0-SNAPSHOT.jar" "-DgroupId=com.QA.Utils" "-DartifactId=QA_Utils" "-Dversion=1.0-SNAPSHOT" "-Dpackaging=jar"

      - name: Run Framework (BDD Default)
        run: mvn clean test -Dsurefire.suiteXmlFiles=${{ github.event.inputs.test_suite || 'testng-bdd.xml' }} -Dheadless=true

      - name: Upload Test Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Automation-Artifacts
          # If any of these folders don't generate on a failed run, the step will still pass
          path: |
            logs/
            reports/
            screenshots/
          retention-days: 7