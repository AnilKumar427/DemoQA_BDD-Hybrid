name: TestNG Test Execution

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  run-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Using xvfb-run provides a virtual display to prevent headless/UI crashes
      - name: Run TestNG Suite
        run: xvfb-run mvn clean test -DsuiteXmlFile=testng.xml

      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          # Note: Ensure it points cleanly to your reports folder
          path: reports/